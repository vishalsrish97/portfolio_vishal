<section class="section-wrapper bg-light">
  <div class="section-inner">

    <div class="section-header reveal">
      <p class="section-tag">Let's Talk</p>
      <h2 class="section-title">Get In Touch</h2>
      <div class="section-line"></div>
    </div>

    <div class="contact-grid">

      <!-- Info -->
      <div class="contact-info reveal">
        <p class="contact-intro">
          Have a project in mind or want to discuss opportunities?
          I'd love to hear from you. Send me a message and I'll get
          back to you as soon as possible.
        </p>

        <div class="contact-item">
          <div class="contact-icon"><i class="fa-solid fa-phone"></i></div>
          <div class="contact-detail">
            <label>Phone</label>
            <a href="tel:+919629588042">{{ data.contact.phone }}</a>
          </div>
        </div>

        <div class="contact-item">
          <div class="contact-icon"><i class="fa-solid fa-envelope"></i></div>
          <div class="contact-detail">
            <label>Email</label>
            <a [href]="'mailto:' + data.contact.email">{{ data.contact.email }}</a>
          </div>
        </div>

        <div class="contact-item">
          <div class="contact-icon"><i class="fa-solid fa-location-dot"></i></div>
          <div class="contact-detail">
            <label>Location</label>
            <span>{{ data.contact.location }}</span>
          </div>
        </div>
      </div>

      <!-- Form -->
      <div class="reveal">
        <form class="contact-form" (ngSubmit)="handleSubmit()" #contactForm="ngForm">

          <div class="form-row">
            <div class="form-group">
              <label for="name">Name</label>
              <input
                id="name"
                type="text"
                name="name"
                placeholder="Your name"
                [(ngModel)]="form.name"
                required
              />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input
                id="email"
                type="email"
                name="email"
                placeholder="your@email.com"
                [(ngModel)]="form.email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <input
              id="subject"
              type="text"
              name="subject"
              placeholder="Project inquiry…"
              [(ngModel)]="form.subject"
            />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              placeholder="Tell me about your project…"
              rows="5"
              [(ngModel)]="form.message"
              required
            ></textarea>
          </div>

          <button
            type="submit"
            class="submit-btn"
            [class.sent]="submitted()"
            [disabled]="contactForm.invalid"
          >
            @if (submitted()) {
              <span>Message Sent!</span>
              <i class="fa-solid fa-check"></i>
            } @else {
              <span>Send Message</span>
              <i class="fa-solid fa-paper-plane"></i>
            }
          </button>

        </form>
      </div>

    </div>
  </div>
</section>
