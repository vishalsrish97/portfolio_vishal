<section class="home-section">

  <!-- Left: Hero Text -->
  <div class="hero-content">
    <p class="hero-label">Portfolio · 2026</p>

    <h1 class="hero-title">
      I am<br>
      <em>a Developer</em>
    </h1>

    <p class="hero-sub">
      Software developer with 3+ years of experience building scalable
      web applications using Angular, Laravel &amp; RESTful APIs.
    </p>

    <div class="hero-cta">
      <a href="#projects" class="btn-outline" (click)="$event.preventDefault(); scrollTo('projects')">
        <span>View Projects</span>
        <i class="fa-solid fa-briefcase"></i>
      </a>
      <a href="#contact" class="btn-filled" (click)="$event.preventDefault(); scrollTo('contact')">
        Hire Me
        <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>
  </div>

  <!-- Right: Visual Panel -->
  <div class="hero-image">
    <div class="hero-image-inner">
      <div class="hero-shape"></div>
      <div class="hero-monogram">V</div>

      <div class="hero-badge">
        <i class="fa-solid fa-code badge-icon"></i>
        <div class="badge-text">
          <strong>3+ Years</strong>
          Web Development
        </div>
      </div>

      <!-- Floating tech chips -->
      <div class="chip chip-1">Angular 18</div>
      <div class="chip chip-2">Laravel</div>
      <div class="chip chip-3">TypeScript</div>
    </div>
  </div>

</section>
